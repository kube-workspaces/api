name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build, Vet and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The repo has had tests since before this workflow existed, but they were
      # never run in CI. -race because the HTTP handlers are concurrent.
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.out ]; then
            {
              echo '### Coverage'
              echo
              echo '```'
              go tool cover -func=coverage.out | tail -20
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  execution-storage:
    name: Persistent execution storage and fault tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Disposable services only; these public credentials are not deployment keys.
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_DB: execution
          POSTGRES_USER: test
          POSTGRES_PASSWORD: disposable-test-password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U test -d execution"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      rustfs:
        image: rustfs/rustfs@sha256:7e948dad4748bda48f8985fda7195f8cf2e4259427011f6120acc2c9acf51587
        env:
          RUSTFS_ACCESS_KEY: disposable-test-access
          RUSTFS_SECRET_KEY: disposable-test-secret
          RUSTFS_VOLUMES: /data
        ports:
          - 9000/tcp
    env:
      KW_EXECUTION_TEST_S3_ACCESS_KEY: disposable-test-access
      KW_EXECUTION_TEST_S3_SECRET_KEY: disposable-test-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Configure disposable service endpoints
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
          S3_PORT: ${{ job.services.rustfs.ports['9000'] }}
        run: |
          echo "KW_EXECUTION_TEST_DATABASE_URL=postgres://test:disposable-test-password@127.0.0.1:$POSTGRES_PORT/execution?sslmode=disable" >> "$GITHUB_ENV"
          echo "KW_EXECUTION_TEST_S3_ENDPOINT=http://127.0.0.1:$S3_PORT" >> "$GITHUB_ENV"

      - name: Wait for disposable S3
        run: curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 --max-time 5 "$KW_EXECUTION_TEST_S3_ENDPOINT/health"

      - name: Storage engines
        run: go test -race -count=1 -timeout=5m -v ./internal/execution/storage -run '^(TestPostgresIntegration|TestS3Integration)$'

      - name: Upgrade worker and phase authority races
        run: go test -race -count=5 -timeout=5m -v ./internal/execution/storage -run '^(TestPostgresUpgradeAuthorityIntegration|TestPostgresUpgradePhasesIntegration)$'

      - name: Durable exact-action phase issuer
        run: go test -race -count=3 -timeout=5m -v ./internal/execution/upgrades -run '^TestPostgresPhaseIssuerIntegration$'

      - name: HTTP recording, connection loss and recovery
        run: go test -race -count=1 -timeout=5m -v -run '^TestExecution(Persistent|PostgresOutage|CommitResponseLoss|ProcessLoss)Integration$' .

  openapi-drift:
    name: OpenAPI spec drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      # gen/ is the source of truth (produced by goa gen from design/design.go).
      # cmd/kube_workspaces/openapi3.{json,yaml} is the embedded copy served at
      # /openapi3.{json,yaml} (go:embed cannot reference ../gen, so it is a
      # manual copy). Fail if either step was skipped, so the served spec can
      # never silently fall behind the design again.
      - name: Regenerate and check for drift
        run: |
          go run goa.design/goa/v3/cmd/goa gen github.com/kube-workspaces/api/design
          if ! git diff --exit-code -- gen/; then
            echo "::error::gen/ differs after goa gen — run 'go run goa.design/goa/v3/cmd/goa gen github.com/kube-workspaces/api/design' and commit the result."
            exit 1
          fi
          for ext in json yaml; do
            if ! diff -q "gen/http/openapi3.$ext" "cmd/kube_workspaces/openapi3.$ext"; then
              echo "::error::cmd/kube_workspaces/openapi3.$ext differs from gen/http/openapi3.$ext — copy it over and commit."
              exit 1
            fi
          done
          if [ -e openapi3.json ] || [ -e openapi3.yaml ]; then
            echo "::error::stale repo-root openapi3 copy has reappeared — it was deleted; gen/ is the source of truth."
            exit 1
          fi
