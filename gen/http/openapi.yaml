swagger: "2.0"
info:
    title: Kube Workspaces API
    description: API for managing container-based workspaces in Kubernetes
    version: 1.0.0
host: localhost:8080
consumes:
    - application/json
    - application/xml
    - application/gob
produces:
    - application/json
    - application/xml
    - application/gob
paths:
    /healthz:
        get:
            tags:
                - health
            summary: check health
            description: Health check endpoint
            operationId: health#check
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/HealthCheckResponseBody'
                        required:
                            - status
            schemes:
                - http
    /v1/images:
        get:
            tags:
                - images
            summary: list images
            description: List available workspace images
            operationId: images#list
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: array
                        items:
                            $ref: '#/definitions/Image'
            schemes:
                - http
        post:
            tags:
                - images
            summary: create images
            description: Create a new image
            operationId: images#create
            parameters:
                - name: CreateRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/CreateImagePayload'
                    required:
                        - name
                        - image
                        - default_port
            responses:
                "201":
                    description: Created response.
                    schema:
                        $ref: '#/definitions/Image'
                "400":
                    description: Bad Request response.
                    schema:
                        type: string
                "409":
                    description: Conflict response.
                    schema:
                        type: string
            schemes:
                - http
    /v1/namespaces:
        get:
            tags:
                - namespaces
            summary: list namespaces
            description: List available namespaces
            operationId: namespaces#list
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: array
                        items:
                            $ref: '#/definitions/Namespace'
            schemes:
                - http
    /v1/volumes:
        get:
            tags:
                - volumes
            summary: list volumes
            description: List all volumes
            operationId: volumes#list
            parameters:
                - name: namespace
                  in: query
                  description: Filter by namespace
                  required: false
                  type: string
                  default: workspaces
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: array
                        items:
                            $ref: '#/definitions/Volume'
            schemes:
                - http
        post:
            tags:
                - volumes
            summary: create volumes
            description: Create a new volume (PVC)
            operationId: volumes#create
            parameters:
                - name: CreateRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/CreateVolumePayload'
                    required:
                        - name
                        - size
            responses:
                "201":
                    description: Created response.
                    schema:
                        $ref: '#/definitions/Volume'
                "400":
                    description: Bad Request response.
                    schema:
                        type: string
                "409":
                    description: Conflict response.
                    schema:
                        type: string
            schemes:
                - http
    /v1/volumes/{name}:
        get:
            tags:
                - volumes
            summary: get volumes
            description: Get a volume by name
            operationId: volumes#get
            parameters:
                - name: namespace
                  in: query
                  description: Namespace
                  required: false
                  type: string
                  default: workspaces
                - name: name
                  in: path
                  description: Volume name
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/Volume'
                "404":
                    description: Not Found response.
                    schema:
                        type: string
            schemes:
                - http
        delete:
            tags:
                - volumes
            summary: delete volumes
            description: Delete a volume
            operationId: volumes#delete
            parameters:
                - name: namespace
                  in: query
                  description: Namespace
                  required: false
                  type: string
                  default: workspaces
                - name: name
                  in: path
                  description: Volume name
                  required: true
                  type: string
            responses:
                "204":
                    description: No Content response.
                "404":
                    description: Not Found response.
                    schema:
                        type: string
            schemes:
                - http
    /v1/workspaces:
        get:
            tags:
                - workspaces
            summary: list workspaces
            description: List all workspaces
            operationId: workspaces#list
            parameters:
                - name: namespace
                  in: query
                  description: Filter by namespace
                  required: false
                  type: string
                  default: workspaces
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: array
                        items:
                            $ref: '#/definitions/Workspace'
            schemes:
                - http
        post:
            tags:
                - workspaces
            summary: create workspaces
            description: Create a new workspace
            operationId: workspaces#create
            parameters:
                - name: CreateRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/CreateWorkspacePayload'
                    required:
                        - name
                        - container
            responses:
                "201":
                    description: Created response.
                    schema:
                        $ref: '#/definitions/Workspace'
                "400":
                    description: Bad Request response.
                    schema:
                        type: string
                "409":
                    description: Conflict response.
                    schema:
                        type: string
            schemes:
                - http
    /v1/workspaces/{name}:
        get:
            tags:
                - workspaces
            summary: get workspaces
            description: Get a workspace by name
            operationId: workspaces#get
            parameters:
                - name: namespace
                  in: query
                  description: Namespace
                  required: false
                  type: string
                  default: workspaces
                - name: name
                  in: path
                  description: Workspace name
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/Workspace'
                "404":
                    description: Not Found response.
                    schema:
                        type: string
            schemes:
                - http
        delete:
            tags:
                - workspaces
            summary: delete workspaces
            description: Delete a workspace
            operationId: workspaces#delete
            parameters:
                - name: namespace
                  in: query
                  description: Namespace
                  required: false
                  type: string
                  default: workspaces
                - name: name
                  in: path
                  description: Workspace name
                  required: true
                  type: string
            responses:
                "204":
                    description: No Content response.
                "404":
                    description: Not Found response.
                    schema:
                        type: string
            schemes:
                - http
    /v1/workspaces/{name}/start:
        post:
            tags:
                - workspaces
            summary: start workspaces
            description: Start a stopped workspace
            operationId: workspaces#start
            parameters:
                - name: namespace
                  in: query
                  description: Namespace
                  required: false
                  type: string
                  default: workspaces
                - name: name
                  in: path
                  description: Workspace name
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/Workspace'
                "404":
                    description: Not Found response.
                    schema:
                        type: string
            schemes:
                - http
    /v1/workspaces/{name}/stop:
        post:
            tags:
                - workspaces
            summary: stop workspaces
            description: Stop a running workspace
            operationId: workspaces#stop
            parameters:
                - name: namespace
                  in: query
                  description: Namespace
                  required: false
                  type: string
                  default: workspaces
                - name: name
                  in: path
                  description: Workspace name
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/Workspace'
                "404":
                    description: Not Found response.
                    schema:
                        type: string
            schemes:
                - http
