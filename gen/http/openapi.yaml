swagger: "2.0"
info:
    title: Kube Workspaces API
    description: API for managing container-based workspaces in Kubernetes
    version: 1.0.0
host: localhost:8080
consumes:
    - application/json
    - application/xml
    - application/gob
produces:
    - application/json
    - application/xml
    - application/gob
paths:
    /healthz:
        get:
            tags:
                - health
            summary: check health
            description: Health check endpoint
            operationId: health#check
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/HealthCheckResponseBody'
                        required:
                            - status
            schemes:
                - http
    /v1/images:
        get:
            tags:
                - images
            summary: list images
            description: List available workspace images
            operationId: images#list
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: array
                        items:
                            $ref: '#/definitions/Image'
            schemes:
                - http
        post:
            tags:
                - images
            summary: create images
            description: Create a new image
            operationId: images#create
            parameters:
                - name: CreateRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/CreateImagePayload'
                    required:
                        - name
                        - image
                        - default_port
            responses:
                "201":
                    description: Created response.
                    schema:
                        $ref: '#/definitions/Image'
                "400":
                    description: Bad Request response.
                    schema:
                        type: string
                "409":
                    description: Conflict response.
                    schema:
                        type: string
            schemes:
                - http
    /v1/namespaces:
        get:
            tags:
                - namespaces
            summary: list namespaces
            description: List available namespaces
            operationId: namespaces#list
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: array
                        items:
                            $ref: '#/definitions/Namespace'
            schemes:
                - http
    /v1/sshkeys:
        get:
            tags:
                - sshkeys
            summary: list sshkeys
            description: List the user's SSH public keys
            operationId: sshkeys#list
            parameters:
                - name: namespace
                  in: query
                  description: Filter by namespace
                  required: false
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: array
                        items:
                            $ref: '#/definitions/Sshkey'
            schemes:
                - http
        post:
            tags:
                - sshkeys
            summary: create sshkeys
            description: Store a new SSH public key
            operationId: sshkeys#create
            parameters:
                - name: CreateRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/CreateSSHKeyPayload'
                    required:
                        - name
                        - public_key
            responses:
                "201":
                    description: Created response.
                    schema:
                        $ref: '#/definitions/Sshkey'
                "400":
                    description: Bad Request response.
                    schema:
                        type: string
                "409":
                    description: Conflict response.
                    schema:
                        type: string
            schemes:
                - http
    /v1/sshkeys/{name}:
        get:
            tags:
                - sshkeys
            summary: get sshkeys
            description: Get an SSH public key by name
            operationId: sshkeys#get
            parameters:
                - name: namespace
                  in: query
                  description: Namespace
                  required: false
                  type: string
                - name: name
                  in: path
                  description: SSH key name
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/Sshkey'
                "404":
                    description: Not Found response.
                    schema:
                        type: string
            schemes:
                - http
        delete:
            tags:
                - sshkeys
            summary: delete sshkeys
            description: Delete an SSH public key
            operationId: sshkeys#delete
            parameters:
                - name: namespace
                  in: query
                  description: Namespace
                  required: false
                  type: string
                - name: name
                  in: path
                  description: SSH key name
                  required: true
                  type: string
            responses:
                "204":
                    description: No Content response.
                "404":
                    description: Not Found response.
                    schema:
                        type: string
            schemes:
                - http
    /v1/volumes:
        get:
            tags:
                - volumes
            summary: list volumes
            description: List all volumes
            operationId: volumes#list
            parameters:
                - name: namespace
                  in: query
                  description: Filter by namespace
                  required: false
                  type: string
                  default: workspaces
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: array
                        items:
                            $ref: '#/definitions/Volume'
            schemes:
                - http
        post:
            tags:
                - volumes
            summary: create volumes
            description: Create a new volume (PVC)
            operationId: volumes#create
            parameters:
                - name: CreateRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/CreateVolumePayload'
                    required:
                        - name
                        - size
            responses:
                "201":
                    description: Created response.
                    schema:
                        $ref: '#/definitions/Volume'
                "400":
                    description: Bad Request response.
                    schema:
                        type: string
                "409":
                    description: Conflict response.
                    schema:
                        type: string
            schemes:
                - http
    /v1/volumes/{name}:
        get:
            tags:
                - volumes
            summary: get volumes
            description: Get a volume by name
            operationId: volumes#get
            parameters:
                - name: namespace
                  in: query
                  description: Namespace
                  required: false
                  type: string
                  default: workspaces
                - name: name
                  in: path
                  description: Volume name
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/Volume'
                "404":
                    description: Not Found response.
                    schema:
                        type: string
            schemes:
                - http
        delete:
            tags:
                - volumes
            summary: delete volumes
            description: Delete a volume
            operationId: volumes#delete
            parameters:
                - name: namespace
                  in: query
                  description: Namespace
                  required: false
                  type: string
                  default: workspaces
                - name: name
                  in: path
                  description: Volume name
                  required: true
                  type: string
            responses:
                "204":
                    description: No Content response.
                "404":
                    description: Not Found response.
                    schema:
                        type: string
            schemes:
                - http
    /v1/workspaces:
        get:
            tags:
                - workspaces
            summary: list workspaces
            description: List all workspaces
            operationId: workspaces#list
            parameters:
                - name: namespace
                  in: query
                  description: Filter by namespace
                  required: false
                  type: string
                  default: workspaces
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: array
                        items:
                            $ref: '#/definitions/Workspace'
            schemes:
                - http
        post:
            tags:
                - workspaces
            summary: create workspaces
            description: Create a new workspace
            operationId: workspaces#create
            parameters:
                - name: CreateRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/CreateWorkspacePayload'
                    required:
                        - name
                        - container
            responses:
                "201":
                    description: Created response.
                    schema:
                        $ref: '#/definitions/Workspace'
                "400":
                    description: Bad Request response.
                    schema:
                        type: string
                "409":
                    description: Conflict response.
                    schema:
                        type: string
            schemes:
                - http
    /v1/workspaces/{name}:
        get:
            tags:
                - workspaces
            summary: get workspaces
            description: Get a workspace by name
            operationId: workspaces#get
            parameters:
                - name: namespace
                  in: query
                  description: Namespace
                  required: false
                  type: string
                  default: workspaces
                - name: name
                  in: path
                  description: Workspace name
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/Workspace'
                "404":
                    description: Not Found response.
                    schema:
                        type: string
            schemes:
                - http
        delete:
            tags:
                - workspaces
            summary: delete workspaces
            description: Delete a workspace
            operationId: workspaces#delete
            parameters:
                - name: namespace
                  in: query
                  description: Namespace
                  required: false
                  type: string
                  default: workspaces
                - name: name
                  in: path
                  description: Workspace name
                  required: true
                  type: string
            responses:
                "204":
                    description: No Content response.
                "404":
                    description: Not Found response.
                    schema:
                        type: string
            schemes:
                - http
    /v1/workspaces/{name}/reset:
        post:
            tags:
                - workspaces
            summary: reset workspaces
            description: Reset a workspace by re-provisioning it from its image
            operationId: workspaces#reset
            parameters:
                - name: namespace
                  in: query
                  description: Namespace
                  required: false
                  type: string
                  default: workspaces
                - name: name
                  in: path
                  description: Workspace name
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/Workspace'
                "400":
                    description: Bad Request response.
                    schema:
                        type: string
                "404":
                    description: Not Found response.
                    schema:
                        type: string
            schemes:
                - http
    /v1/workspaces/{name}/start:
        post:
            tags:
                - workspaces
            summary: start workspaces
            description: Start a stopped workspace
            operationId: workspaces#start
            parameters:
                - name: namespace
                  in: query
                  description: Namespace
                  required: false
                  type: string
                  default: workspaces
                - name: name
                  in: path
                  description: Workspace name
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/Workspace'
                "404":
                    description: Not Found response.
                    schema:
                        type: string
            schemes:
                - http
    /v1/workspaces/{name}/stop:
        post:
            tags:
                - workspaces
            summary: stop workspaces
            description: Stop a running workspace
            operationId: workspaces#stop
            parameters:
                - name: namespace
                  in: query
                  description: Namespace
                  required: false
                  type: string
                  default: workspaces
                - name: name
                  in: path
                  description: Workspace name
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/Workspace'
                "404":
                    description: Not Found response.
                    schema:
                        type: string
            schemes:
                - http
definitions:
    ContainerState:
        title: ContainerState
        type: object
        properties:
            message:
                type: string
                description: Details about the state
                example: Ut necessitatibus eveniet perspiciatis quod vero nobis.
            reason:
                type: string
                description: Reason for the state
                example: Dolores possimus unde perferendis corporis est.
            started_at:
                type: string
                description: Time the container started
                example: Consequuntur nihil in voluptate est ut dignissimos.
            state:
                type: string
                description: 'Current state: running, waiting, terminated'
                example: running
                enum:
                    - running
                    - waiting
                    - terminated
                    - unknown
        description: State of the workspace container
        example:
            message: Iusto veniam id optio aut.
            reason: Sunt a.
            started_at: Quibusdam quisquam labore quas.
            state: terminated
    CreateImagePayload:
        title: CreateImagePayload
        type: object
        properties:
            category:
                type: string
                description: Category for grouping (e.g. Desktop, IDE, Tool, Game)
                example: IDE
            default_args:
                type: array
                items:
                    type: string
                    example: Voluptatem aliquam ut illum quaerat.
                description: Default command-line args
                example:
                    - Quia eum.
                    - Tempora fugit.
            default_cloud_init:
                type: boolean
                description: Set to true when the image has cloud-init baked in, allowing user-data (e.g. a user/password) to be seeded into the guest at first boot
                example: true
            default_credentials:
                $ref: '#/definitions/ImageCredentials'
            default_env:
                type: array
                items:
                    $ref: '#/definitions/ImageEnvVar'
                description: Default environment variables
                example:
                    - name: Est sint.
                      value: Accusantium eos est.
                    - name: Est sint.
                      value: Accusantium eos est.
                    - name: Est sint.
                      value: Accusantium eos est.
            default_homedir:
                type: string
                description: Default home directory for the default user
                example: Qui omnis provident vel dignissimos quibusdam.
            default_password:
                type: string
                description: Known default password for DefaultUser. Only set when the image has a known default password; leave unset when the guest uses no password
                example: Est reiciendis illum.
            default_path:
                type: string
                description: Default URL path for connecting
                example: /
            default_port:
                type: integer
                description: Default container port
                example: 8080
                format: int64
            default_shared_memory:
                type: boolean
                description: Automatically mount /dev/shm as emptyDir with medium=Memory (required for Selkies streaming, Chrome, ML frameworks)
                example: false
            default_shell:
                type: string
                description: Default shell for exec/console sessions (e.g. /bin/bash)
                example: Eos quibusdam ut dolore tempore.
            default_uid:
                type: integer
                description: UID that the main container runs as (sets runAsUser and fsGroup)
                example: 6456743304432892810
                format: int64
            default_user:
                type: string
                description: Default user for this image
                example: Eligendi eum tempore doloremque suscipit quibusdam mollitia.
            default_user_data:
                type: string
                description: Reserved user-data for the guest (cloud-init). Empty by default; later used to seed first-boot configuration when cloud-init is supported. Not yet consumed
                example: Dicta fugiat aliquid distinctio in enim ex.
            description:
                type: string
                description: Description of the image
                example: Neque doloremque adipisci.
            homepage_url:
                type: string
                description: Project homepage or documentation URL
                example: Quibusdam mollitia voluptatem quae est nulla nihil.
            icon:
                type: string
                description: Icon identifier
                example: Qui ea fugit molestias soluta illum voluptatem.
            image:
                type: string
                description: Container image reference
                example: codercom/code-server:latest
            image_homepage_url:
                type: string
                description: Container image registry page (e.g. Docker Hub)
                example: Totam odio odio ducimus.
            links:
                type: array
                items:
                    $ref: '#/definitions/ImageLink'
                description: Additional relevant URLs for this image
                example:
                    - title: Natus odio rerum exercitationem eum harum molestiae.
                      url: Ut nulla dolorem.
                    - title: Natus odio rerum exercitationem eum harum molestiae.
                      url: Ut nulla dolorem.
                    - title: Natus odio rerum exercitationem eum harum molestiae.
                      url: Ut nulla dolorem.
            name:
                type: string
                description: Display name
                example: Code Server (VS Code)
            privileged:
                type: boolean
                description: Run container in privileged mode
                default: false
                example: true
            proxy_config:
                $ref: '#/definitions/ImageProxyConfig'
            source_url:
                type: string
                description: Source code repository URL
                example: Qui tempore accusantium sint nihil neque.
            tags:
                type: array
                items:
                    type: string
                    example: Ex quidem quibusdam ut.
                description: Tags for filtering/searching images
                example:
                    - development
                    - vscode
            workspace_types:
                type: array
                items:
                    type: string
                    example: Animi et ipsa ipsum accusamus numquam quos.
                description: Workspace types this image supports (container, vm, scratch). Empty means container-only
                example:
                    - container
        example:
            category: IDE
            default_args:
                - Minus odio quas facilis ut.
                - Aut facilis.
                - Repellendus in quaerat culpa non.
                - Reprehenderit perspiciatis dolorem distinctio accusamus quis nam.
            default_cloud_init: false
            default_credentials:
                password: Minus facilis cumque.
                username: Quisquam quas inventore magnam iusto.
            default_env:
                - name: Est sint.
                  value: Accusantium eos est.
                - name: Est sint.
                  value: Accusantium eos est.
                - name: Est sint.
                  value: Accusantium eos est.
                - name: Est sint.
                  value: Accusantium eos est.
            default_homedir: Itaque cumque error et omnis.
            default_password: Placeat reiciendis eveniet.
            default_path: /
            default_port: 8080
            default_shared_memory: true
            default_shell: Et nostrum.
            default_uid: 5530513012586635395
            default_user: Esse repellat quo fugit consequatur non.
            default_user_data: Autem corrupti ut culpa quidem magni.
            description: Inventore vel enim et odit.
            homepage_url: Ex reprehenderit cupiditate quas cumque voluptatem minima.
            icon: Ad quas.
            image: codercom/code-server:latest
            image_homepage_url: Consequatur veritatis.
            links:
                - title: Natus odio rerum exercitationem eum harum molestiae.
                  url: Ut nulla dolorem.
                - title: Natus odio rerum exercitationem eum harum molestiae.
                  url: Ut nulla dolorem.
                - title: Natus odio rerum exercitationem eum harum molestiae.
                  url: Ut nulla dolorem.
                - title: Natus odio rerum exercitationem eum harum molestiae.
                  url: Ut nulla dolorem.
            name: Code Server (VS Code)
            privileged: true
            proxy_config:
                custom_request_headers:
                    Quia tempore ab sunt quibusdam voluptas nostrum.: Temporibus at et et blanditiis rerum id.
                    Voluptate voluptas dolorem qui aut inventore.: Est cupiditate ducimus.
                inject_base_tag: false
                needs_noop_sw: true
                preserve_path_prefix: true
                rewrite_host_absolute_paths: false
                tls_insecure: true
                websocket_paths:
                    - /websockify
            source_url: Voluptate officiis nostrum corrupti ut ex repudiandae.
            tags:
                - development
                - vscode
            workspace_types:
                - container
        required:
            - name
            - image
            - default_port
    CreateSSHKeyPayload:
        title: CreateSSHKeyPayload
        type: object
        properties:
            key_name:
                type: string
                description: Human-friendly label for the key
                example: Laptop 2025
            name:
                type: string
                description: Resource name for the SshKey CR
                example: laptop-2025
                pattern: ^[a-z0-9]([a-z0-9\-]*[a-z0-9])?$
                maxLength: 63
            namespace:
                type: string
                description: Target namespace (defaults to the user's personal namespace)
                example: chris-at-fordham-id-au
            public_key:
                type: string
                description: SSH public key line (e.g. ssh-ed25519 AAAA... user@host)
                example: ssh-ed25519 AAAA... user@host
        example:
            key_name: Laptop 2025
            name: laptop-2025
            namespace: chris-at-fordham-id-au
            public_key: ssh-ed25519 AAAA... user@host
        required:
            - name
            - public_key
    CreateVolumePayload:
        title: CreateVolumePayload
        type: object
        properties:
            access_mode:
                type: string
                description: Access mode
                default: ReadWriteOnce
                example: ReadWriteOnce
                enum:
                    - ReadWriteOnce
                    - ReadWriteMany
                    - ReadOnlyMany
            name:
                type: string
                description: PVC name
                example: my-data
                pattern: ^[a-z0-9]([a-z0-9\-]*[a-z0-9])?$
                maxLength: 63
            namespace:
                type: string
                description: Target namespace
                default: workspaces
                example: Unde dolorem fuga porro ratione impedit.
            size:
                type: string
                description: Storage size
                default: 5Gi
                example: 10Gi
            storage_class:
                type: string
                description: Storage class name
                example: standard
        example:
            access_mode: ReadWriteOnce
            name: my-data
            namespace: Omnis animi aut.
            size: 10Gi
            storage_class: standard
        required:
            - name
            - size
    CreateWorkspacePayload:
        title: CreateWorkspacePayload
        type: object
        properties:
            container:
                $ref: '#/definitions/WorkspaceContainer'
            env:
                type: array
                items:
                    $ref: '#/definitions/EnvVar'
                description: Custom environment variables to inject into the workspace container
                example:
                    - name: MY_VAR
                      value: my-value
                    - name: MY_VAR
                      value: my-value
            image_pull_policy:
                type: string
                description: Image pull policy for the workspace container (Always, IfNotPresent, Never)
                default: IfNotPresent
                example: Always
                enum:
                    - Always
                    - IfNotPresent
                    - Never
            name:
                type: string
                description: Workspace name
                example: my-workspace
                pattern: ^[a-z0-9]([a-z0-9\-]*[a-z0-9])?$
                maxLength: 63
            namespace:
                type: string
                description: Target namespace
                default: workspaces
                example: workspaces
            node_selector:
                type: object
                description: Node selector labels for scheduling
                example:
                    Voluptatem et.: Quisquam aut consequuntur dignissimos nostrum dicta perferendis.
                additionalProperties:
                    type: string
                    example: Voluptas eos ducimus est.
            shared_memory:
                type: boolean
                description: Mount /dev/shm as an emptyDir with medium=Memory (required for Chrome, ML frameworks)
                default: false
                example: true
            tolerations:
                type: array
                items:
                    $ref: '#/definitions/Toleration'
                description: Pod tolerations for scheduling
                example:
                    - effect: ""
                      key: nvidia.com/gpu
                      operator: Exists
                      value: "true"
                    - effect: ""
                      key: nvidia.com/gpu
                      operator: Exists
                      value: "true"
                    - effect: ""
                      key: nvidia.com/gpu
                      operator: Exists
                      value: "true"
                    - effect: ""
                      key: nvidia.com/gpu
                      operator: Exists
                      value: "true"
            type:
                type: string
                description: 'Workspace type: ''container'' (default, runs as a StatefulSet), ''vm'' (KubeVirt VirtualMachine booting a containerDisk image), or ''scratch'' (plain Deployment)'
                default: container
                example: container
                enum:
                    - container
                    - vm
                    - scratch
            volume_mounts:
                type: array
                items:
                    $ref: '#/definitions/VolumeMount'
                description: Volumes to mount
                example:
                    - mount_path: /home/coder
                      name: my-workspace-data
                    - mount_path: /home/coder
                      name: my-workspace-data
                    - mount_path: /home/coder
                      name: my-workspace-data
        example:
            container:
                cpu_limit: "2"
                cpu_request: 500m
                gpu_request: "1"
                gpu_vendor: nvidia.com/gpu
                image: codercom/code-server:latest
                memory_limit: 2Gi
                memory_request: 512Mi
                name: code-server
                port: 1526708642241994080
            env:
                - name: MY_VAR
                  value: my-value
                - name: MY_VAR
                  value: my-value
                - name: MY_VAR
                  value: my-value
            image_pull_policy: IfNotPresent
            name: my-workspace
            namespace: workspaces
            node_selector:
                Earum est quibusdam.: Ut temporibus laborum aperiam rerum laudantium.
                Ut tempora odio maxime.: Aut praesentium possimus.
            shared_memory: false
            tolerations:
                - effect: ""
                  key: nvidia.com/gpu
                  operator: Exists
                  value: "true"
                - effect: ""
                  key: nvidia.com/gpu
                  operator: Exists
                  value: "true"
                - effect: ""
                  key: nvidia.com/gpu
                  operator: Exists
                  value: "true"
                - effect: ""
                  key: nvidia.com/gpu
                  operator: Exists
                  value: "true"
            type: container
            volume_mounts:
                - mount_path: /home/coder
                  name: my-workspace-data
                - mount_path: /home/coder
                  name: my-workspace-data
        required:
            - name
            - container
    EnvVar:
        title: EnvVar
        type: object
        properties:
            name:
                type: string
                description: Environment variable name
                example: MY_VAR
            value:
                type: string
                description: Environment variable value
                example: my-value
        description: Custom environment variable for a workspace
        example:
            name: MY_VAR
            value: my-value
        required:
            - name
            - value
    HealthCheckResponseBody:
        title: HealthCheckResponseBody
        type: object
        properties:
            status:
                type: string
                description: Health status
                example: Debitis repellat nam.
        example:
            status: Officiis excepturi rerum amet ut unde.
        required:
